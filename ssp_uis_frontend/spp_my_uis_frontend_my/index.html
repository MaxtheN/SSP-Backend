<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv='cache-control' content='no-cache'>
  <meta http-equiv='expires' content='0'>
  <meta http-equiv='pragma' content='no-cache'>
  <link rel="icon" href="/favicon.ico">
  <title>my.chamber.uz</title>
  <meta name="description"
    content="My Chamber – O'zbekiston savdo-sanoat palatasining a'zolari uchun onlayn xizmatlar platformasi. Ro‘yxatdan o‘tish, hujjatlarni boshqarish va ko‘plab imkoniyatlar bir joyda!">
  <style>
    #circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;

    }

    #circle::before,
    #circle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border: 5px solid #888;
      border-radius: 50%;
      animation: animate 2s infinite linear;
    }

    #circle::before {
      animation-delay: 0s;
    }

    #circle::after {
      animation-delay: 1s;
    }

    @keyframes animate {
      0% {
        width: 0;
        height: 0;
        opacity: 1;
      }

      100% {
        width: 100%;
        height: 100%;
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <noscript>
    <strong>We're sorry but this app doesn't work properly without JavaScript enabled. Please enable it to
      continue.</strong>
  </noscript>
  <div id="app"></div>
  <div id="circle"></div>
  <script>
    document.onreadystatechange = function () {
      var state = document.readyState
      if (state == 'complete') {
        document.getElementById('circle').style.visibility = "hidden";
      }
    }
  </script>
  <script type="module" src="/src/main.js"></script>
  <!-- built files will be auto injected -->

  <script>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        console.log('load')
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('Service Worker registered with scope:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }

  </script>
</body>

</html>
