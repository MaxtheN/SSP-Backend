name: build

on:
   push:
      branches:
         - main
         - dev
   pull_request:
      branches:
         - main
         - dev

jobs:
   build:
      runs-on: ${{ matrix.os }}

      strategy:
         matrix:
            os: [ubuntu-latest]
            node-version: [16.15.x]

      steps:
         - uses: actions/checkout@v3
         - name: Use Node.js ${{ matrix.node-version }}
           uses: actions/setup-node@v3
           with:
              node-version: ${{ matrix.node-version }}
         - run: npm install
         - run: npm run build
